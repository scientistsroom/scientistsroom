<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>scientistsroom</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #efefe9;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ===============================
       HOME
    ================================ */

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 700px;
      overflow: hidden;
      background: #efefe9;
    }

    /* ===============================
       TOP
    ================================ */

    .top {
      position: absolute;
      top: 34px;
      left: 40px;
      right: 40px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 12px;
      font-weight: 600;

      z-index: 20;
    }

    .top-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.22;
    }

    /* ===============================
       TITLE
    ================================ */

    .hero-title {
      position: absolute;
      top: 9%;
      left: 50%;

      transform: translateX(-50%);

      font-size: clamp(42px, 5vw, 76px);
      letter-spacing: -0.07em;
      font-weight: 500;

      z-index: 10;
    }

    /* ===============================
       GUIDE CIRCLE
    ================================ */

    .guide-circle {
      position: absolute;

      width: min(59vw, 720px);
      aspect-ratio: 1 / 1;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border: 1px solid rgba(0, 0, 0, 0.055);
      border-radius: 50%;

      pointer-events: none;
    }

    .guide-circle::before,
    .guide-circle::after {
      content: "";
      position: absolute;
      background: rgba(0, 0, 0, 0.045);
    }

    .guide-circle::before {
      width: 140%;
      height: 1px;
      left: -20%;
      top: 50%;
    }

    .guide-circle::after {
      width: 1px;
      height: 140%;
      top: -20%;
      left: 50%;
    }

    .guide-line {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 118%;
      height: 1px;

      background: rgba(0, 0, 0, 0.035);

      transform-origin: center;
    }

    .guide-line.a {
      transform: translate(-50%, -50%) rotate(32deg);
    }

    .guide-line.b {
      transform: translate(-50%, -50%) rotate(-32deg);
    }

    /* ===============================
       EARTH
    ================================ */

    #globe {
      position: absolute;

      width: min(38vw, 510px);
      height: min(38vw, 510px);

      left: 50%;
      top: 51%;

      transform: translate(-50%, -50%);

      z-index: 5;
    }

    #globe canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ===============================
       SIDE LINES
    ================================ */

    .side-line {
      position: absolute;

      top: 45%;

      width: 12%;
      height: 1px;

      background: rgba(0, 0, 0, 0.1);
    }

    .side-line.left {
      left: 3.5%;
    }

    .side-line.right {
      right: 3.5%;
    }

    /* ===============================
       BOTTOM
    ================================ */

    .bottom-info {
      position: absolute;

      left: 40px;
      right: 40px;
      bottom: 34px;

      display: grid;
      grid-template-columns: 1fr 1fr 1fr;

      gap: 80px;

      z-index: 10;
    }

    .info h3 {
      font-size: 13px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .info p {
      max-width: 310px;

      color: rgba(0, 0, 0, 0.35);

      font-size: 10px;
      line-height: 1.4;
    }

    .info.center {
      text-align: center;
    }

    .info.center p {
      margin: auto;
    }

    .info.right {
      text-align: right;
    }

    .info.right p {
      margin-left: auto;
    }

    /* ===============================
       MOBILE
    ================================ */

    @media (max-width: 800px) {
      .hero {
        min-height: 100svh;
      }

      .top {
        top: 22px;
        left: 20px;
        right: 20px;
      }

      .hero-title {
        font-size: 44px;
        top: 13%;
      }

      #globe {
        width: 74vw;
        height: 74vw;
        top: 50%;
      }

      .guide-circle {
        width: 92vw;
        top: 50%;
      }

      .side-line {
        display: none;
      }

      .bottom-info {
        left: 20px;
        right: 20px;
        bottom: 22px;

        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .bottom-info .center {
        display: none;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <!-- TOP -->

    <header class="top">
      <div>scientistsroom</div>

      <div class="top-center">
        PORTFOLIO
      </div>

      <div>2026</div>
    </header>


    <!-- TITLE -->

    <h1 class="hero-title">
      scientistsroom
    </h1>


    <!-- GUIDE -->

    <div class="guide-circle">
      <div class="guide-line a"></div>
      <div class="guide-line b"></div>
    </div>


    <div class="side-line left"></div>
    <div class="side-line right"></div>


    <!-- EARTH -->

    <div id="globe"></div>


    <!-- BOTTOM INFO -->

    <div class="bottom-info">

      <div class="info">
        <h3>Visual Design</h3>

        <p>
          Graphic / Editorial / Branding /
          Exhibition / Digital Experience
        </p>
      </div>


      <div class="info center">
        <h3>scientistsroom</h3>

        <p>
          Visual communication across
          print, space and digital media.
        </p>
      </div>


      <div class="info right">
        <h3>Selected Works</h3>

        <p>
          Brand / Editorial / Exhibition /
          Package / Art Direction
        </p>
      </div>

    </div>

  </main>


  <script type="module">

    import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

    import ThreeGlobe from
    "https://cdn.jsdelivr.net/npm/three-globe/+esm";


    /* ===============================
       SCENE
    ================================ */

    const el =
      document.getElementById("globe");

    const scene =
      new THREE.Scene();


    /* ===============================
       CAMERA
    ================================ */

    const camera =
      new THREE.PerspectiveCamera(
        38,
        1,
        0.1,
        1000
      );

    camera.position.z = 320;


    /* ===============================
       RENDERER
    ================================ */

    const renderer =
      new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    renderer.setClearColor(
      0x000000,
      0
    );

    el.appendChild(
      renderer.domElement
    );


    /* ===============================
       GLOBE
    ================================ */

    const globe =
      new ThreeGlobe({
        waitForGlobeReady: true,
        animateIn: false
      });

    /* 먼저 씬에 추가 */
    scene.add(globe);


    /* ===============================
       GLOBE MATERIAL
    ================================ */

    globe.globeMaterial(
      new THREE.MeshPhysicalMaterial({
        color: 0xf1f1ec,

        roughness: 0.5,
        metalness: 0,

        transparent: true,
        opacity: 0.96
      })
    );


    /* ===============================
       CONTINENTS
    ================================ */

    try {

      const countries =
        await fetch(
          "https://raw.githubusercontent.com/vasturiano/three-globe/master/example/datasets/ne_110m_admin_0_countries.geojson"
        )
        .then(
          response => response.json()
        );


      globe
        .polygonsData(
          countries.features
        )

        .polygonAltitude(
          0.006
        )

        .polygonCapColor(
          () =>
          "rgba(20,20,20,0.52)"
        )

        .polygonSideColor(
          () =>
          "rgba(0,0,0,0.05)"
        )

        .polygonStrokeColor(
          () =>
          "rgba(255,255,255,0.3)"
        );

    }

    catch (error) {

      console.log(
        "대륙 데이터를 불러오지 못했습니다.",
        error
      );

    }


    /* ===============================
       DOTS
    ================================ */

    const dots = [];


    for (
      let lat = -80;
      lat <= 80;
      lat += 6
    ) {

      for (
        let lng = -180;
        lng < 180;
        lng += 6
      ) {

        dots.push({

          lat:
            lat +
            (Math.random() - 0.5) *
            1.5,

          lng:
            lng +
            (Math.random() - 0.5) *
            1.5,

          size:
            Math.random() *
            0.16 +
            0.04

        });

      }

    }


    globe
      .pointsData(dots)

      .pointLat(
        d => d.lat
      )

      .pointLng(
        d => d.lng
      )

      .pointAltitude(
        0.01
      )

      .pointRadius(
        d => d.size
      )

      .pointColor(
        () =>
        "rgba(0,0,0,0.16)"
      );


    /* ===============================
       ATMOSPHERE
    ================================ */

    globe
      .showAtmosphere(true)

      .atmosphereColor(
        "#d5d5d0"
      )

      .atmosphereAltitude(
        0.1
      );


    /* ===============================
       SCALE
    ================================ */

    globe.scale.set(
      1.35,
      1.35,
      1.35
    );


    /* ===============================
       LIGHT
    ================================ */

    const light1 =
      new THREE.DirectionalLight(
        0xffffff,
        3.2
      );

    light1.position.set(
      2,
      3,
      4
    );

    scene.add(light1);


    const light2 =
      new THREE.DirectionalLight(
        0x7895ff,
        1.4
      );

    light2.position.set(
      -3,
      0,
      2
    );

    scene.add(light2);


    const ambient =
      new THREE.AmbientLight(
        0xffffff,
        1.5
      );

    scene.add(ambient);


    /* ===============================
       INITIAL ROTATION
    ================================ */

    globe.rotation.x =
      THREE.MathUtils.degToRad(
        -10
      );

    globe.rotation.z =
      THREE.MathUtils.degToRad(
        -7
      );


    /* ===============================
       MOUSE
    ================================ */

    let mouseX = 0;
    let mouseY = 0;


    window.addEventListener(
      "mousemove",
      event => {

        mouseX =
          event.clientX /
          window.innerWidth -
          0.5;

        mouseY =
          event.clientY /
          window.innerHeight -
          0.5;

      }
    );


    /* ===============================
       RESIZE
    ================================ */

    function resize() {

      const width =
        el.clientWidth;

      const height =
        el.clientHeight;


      renderer.setSize(
        width,
        height
      );


      camera.aspect =
        width /
        height;

      camera.updateProjectionMatrix();

    }


    window.addEventListener(
      "resize",
      resize
    );

    resize();


    /* ===============================
       ANIMATION
    ================================ */

    let targetX =
      globe.rotation.x;


    function animate() {

      requestAnimationFrame(
        animate
      );


      /* 자동 회전 */

      globe.rotation.y +=
        0.0015;


      /* 마우스에 따라 아주 살짝 움직임 */

      targetX =
        THREE.MathUtils.degToRad(-10)
        +
        mouseY *
        0.07;


      globe.rotation.x +=
        (
          targetX -
          globe.rotation.x
        )
        *
        0.02;


      renderer.render(
        scene,
        camera
      );

    }


    animate();

  </script>

</body>
</html>
