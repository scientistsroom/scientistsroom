<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>scientistsroom</title>

<!-- Globe -->
<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #efefe9;
  color: #111;
  font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   HOME
========================= */

.hero {
  position: relative;

  width: 100vw;
  height: 100vh;

  min-height: 650px;

  overflow: hidden;

  background: #efefe9;
}


/* =========================
   TOP
========================= */

.top {

  position: absolute;

  top: 32px;
  left: 40px;
  right: 40px;

  display: flex;
  justify-content: space-between;

  font-size: 12px;
  font-weight: 600;

  z-index: 20;

}


.top-center {

  position: absolute;

  left: 50%;

  transform: translateX(-50%);

  opacity: .25;

}


/* =========================
   TITLE
========================= */

.hero-title {

  position: absolute;

  top: 8%;

  left: 50%;

  transform: translateX(-50%);

  font-size: clamp(45px, 5vw, 80px);

  font-weight: 500;

  letter-spacing: -.07em;

  z-index: 20;

  white-space: nowrap;

}


/* =========================
   GUIDE
========================= */

.guide {

  position: absolute;

  width: min(59vw, 720px);

  aspect-ratio: 1;

  left: 50%;
  top: 50%;

  transform:
  translate(-50%, -50%);

  border:

  1px solid
  rgba(0,0,0,.055);

  border-radius: 50%;

  pointer-events: none;

}


.guide::before {

  content: "";

  position: absolute;

  width: 140%;
  height: 1px;

  left: -20%;
  top: 50%;

  background:
  rgba(0,0,0,.05);

}


.guide::after {

  content: "";

  position: absolute;

  height: 140%;
  width: 1px;

  left: 50%;
  top: -20%;

  background:
  rgba(0,0,0,.05);

}


.diagonal {

  position: absolute;

  width: 118%;
  height: 1px;

  left: 50%;
  top: 50%;

  background:
  rgba(0,0,0,.035);

}


.diagonal.a {

  transform:
  translate(-50%,-50%)
  rotate(32deg);

}


.diagonal.b {

  transform:
  translate(-50%,-50%)
  rotate(-32deg);

}


/* =========================
   GLOBE
========================= */

#globe {

  position: absolute;

  width: min(38vw, 510px);
  height: min(38vw, 510px);

  left: 50%;
  top: 51%;

  transform:
  translate(-50%, -50%);

  z-index: 10;

}


/* 지구를 전체 사이트 톤에 맞춰
   흑백에 가깝게 */

#globe canvas {

  filter:
  grayscale(1)
  contrast(.88)
  brightness(1.12);

}


/* =========================
   SIDE LINE
========================= */

.side {

  position: absolute;

  top: 45%;

  width: 12%;

  height: 1px;

  background:
  rgba(0,0,0,.11);

}


.side.left {

  left: 3.5%;

}


.side.right {

  right: 3.5%;

}


/* =========================
   BOTTOM
========================= */

.bottom {

  position: absolute;

  left: 40px;
  right: 40px;
  bottom: 34px;

  display: grid;

  grid-template-columns:
  1fr 1fr 1fr;

  gap: 80px;

  z-index: 20;

}


.info h3 {

  font-size: 13px;

  margin-bottom: 8px;

  font-weight: 600;

}


.info p {

  max-width: 300px;

  font-size: 10px;

  line-height: 1.4;

  color:
  rgba(0,0,0,.38);

}


.info.center {

  text-align: center;

}


.info.center p {

  margin: auto;

}


.info.right {

  text-align: right;

}


.info.right p {

  margin-left: auto;

}


/* =========================
   MOBILE
========================= */

@media(max-width:800px) {

  .top {

    top: 22px;
    left: 20px;
    right: 20px;

  }


  .hero-title {

    top: 13%;

    font-size:
    clamp(38px, 11vw, 55px);

  }


  #globe {

    width: 72vw;
    height: 72vw;

    top: 50%;

  }


  .guide {

    width: 92vw;

  }


  .side {

    display: none;

  }


  .bottom {

    left: 20px;
    right: 20px;
    bottom: 22px;

    grid-template-columns:
    1fr 1fr;

  }


  .info.center {

    display: none;

  }

}

</style>
</head>



<body>


<main class="hero">


<!-- =========================
     HEADER
========================= -->

<header class="top">

<div>
scientistsroom
</div>


<div class="top-center">
PORTFOLIO
</div>


<div>
2026
</div>

</header>



<!-- =========================
     TITLE
========================= -->

<h1 class="hero-title">

scientistsroom

</h1>



<!-- =========================
     GUIDE
========================= -->

<div class="guide">

<div class="diagonal a"></div>

<div class="diagonal b"></div>

</div>


<div class="side left"></div>

<div class="side right"></div>



<!-- =========================
     EARTH
========================= -->

<div id="globe"></div>



<!-- =========================
     BOTTOM
========================= -->

<div class="bottom">


<div class="info">

<h3>
Visual Design
</h3>

<p>

Graphic / Editorial /
Branding / Exhibition /
Digital Experience

</p>

</div>



<div class="info center">

<h3>
scientistsroom
</h3>

<p>

Visual communication
across print, space
and digital media.

</p>

</div>



<div class="info right">

<h3>
Selected Works
</h3>

<p>

Brand / Editorial /
Exhibition / Package /
Art Direction

</p>

</div>


</div>


</main>



<script>

/* =========================
   GLOBE
========================= */

const container =
document.getElementById(
  "globe"
);


/* globe 생성 */

const world =
new Globe(container)

.width(
  container.clientWidth
)

.height(
  container.clientHeight
)

.backgroundColor(
  "rgba(0,0,0,0)"
)

.globeImageUrl(
  "https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg"
)

.showAtmosphere(true)

.atmosphereColor(
  "#d4d4cf"
)

.atmosphereAltitude(
  0.08
);


/* =========================
   CAMERA
========================= */

world.pointOfView({

  lat: 15,

  lng: 20,

  altitude: 2.05

});


/* =========================
   ROTATION
========================= */

const controls =
world.controls();


controls.autoRotate = true;

controls.autoRotateSpeed =
0.55;


controls.enableZoom = false;


/* 마우스로 직접 돌리는 건 가능 */

controls.enableRotate = true;


/* =========================
   RESIZE
========================= */

function resizeGlobe() {

  world
  .width(
    container.clientWidth
  )

  .height(
    container.clientHeight
  );

}


window.addEventListener(
  "resize",
  resizeGlobe
);

</script>


</body>
</html>
